# A generic, single database configuration for Alembic

[alembic]
# path to migration scripts
script_location = alembic

# template used to generate migration files
# file_template = %%(rev)s_%%(slug)s

# timezone to use when rendering the date within the migration file
# timezone =

# max length of characters to clone to the "slug" field
# truncate_slug_length = 40

# set to 'true' to run the environment during
# the 'revision' command, regardless of autogenerate
# revision_environment = false

# set to 'true' to allow modules to be loaded
# from paths that are relative to the current directory
# prepend_sys_path = true

# version location specification; this defaults
# to alembic/versions.  when using multiple version
# directories, paths must be separated by spaces
# version_locations = %(here)s/bar %(here)s/bat alembic/versions

# the proposal to write to the config file when
# new revisions are made (defaults to the current datetime)
# revision_date_format = %%Y-%%m-%%d_%%H:%%M:%%S

# the database URL is overridden in env.py, so this is a placeholder
sqlalchemy.url = postgresql://postgres:password@localhost:5432/tradovera

[logging]
default_handler = console

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stdout,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(asctime)s %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
