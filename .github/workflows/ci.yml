name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ruff
        
    - name: Lint with Ruff
      run: |
        ruff check .
        
    - name: Format Check with Ruff
      run: |
        ruff format --check .
        
    - name: Run Unit Tests with Pytest
      run: |
        pip install pytest
        pytest tests/
