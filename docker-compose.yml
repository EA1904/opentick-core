version: "3.8"

services:
  db:
    image: timescale/timescaledb:latest-pg16
    container_name: tradovera_db
    restart: always
    environment:
      POSTGRES_DB: tradovera
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - tradovera_net

  redis:
    image: redis:7-alpine
    container_name: tradovera_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    networks:
      - tradovera_net

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: tradovera_backend
    restart: always
    environment:
      - DATABASE_URL=postgresql://postgres:password@db:5432/tradovera
      - REDIS_URL=redis://redis:6379/0
      - TRADOVERA_WORKSPACE_ROOT=/workspace
      - SECRET_KEY=supersecretjwtkeyforlocaldevelopment123!
      - ACCESS_TOKEN_EXPIRE_MINUTES=1440
      - PORT=8000
    ports:
      - "8000:8000"
    volumes:
      - .:/workspace
    depends_on:
      - db
      - redis
    networks:
      - tradovera_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tradovera_frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend
    networks:
      - tradovera_net

  data-explorer:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: tradovera_data_explorer
    restart: always
    environment:
      - TRADOVERA_WORKSPACE_ROOT=/workspace
    ports:
      - "8001:8001"
    volumes:
      - .:/workspace
    command: uvicorn data_explorer:app --host 0.0.0.0 --port 8001
    networks:
      - tradovera_net

volumes:
  pgdata:
  redisdata:

networks:
  tradovera_net:
    driver: bridge
